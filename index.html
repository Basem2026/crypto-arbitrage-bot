<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crypto Arbitrage - Live</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#0f1724; color:#e6eef8; font-family: Inter, system-ui, Arial; }
.navbar { background:#0b1220; }
.section { background:#0b1220; border-radius:12px; padding:16px; margin-top:14px; box-shadow: 0 6px 18px rgba(2,6,23,0.6); }
.table thead { background:#0d1b2a; }
.btn-glow { box-shadow: 0 6px 20px rgba(3,102,214,0.18); transition: transform .12s; }
.btn-glow:hover { transform: translateY(-3px); }
.badge-live { background: linear-gradient(90deg,#00d27a,#00b894); color:#012; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand">Crypto Arbitrage</a>
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-light me-2 btn-glow" id="btnMode">DEMO</button>
      <button class="btn btn-outline-light me-2" id="btnLang">AR</button>
      <span class="badge badge-live me-1" id="liveBadge">LIVE</span>
    </div>
  </div>
</nav>

<div class="container">
  <div class="section">
    <div class="d-flex justify-content-between align-items-center">
      <h5 id="titleTop">أعلى 30 عملة</h5>
      <div>
        <button class="btn btn-sm btn-primary me-2" id="btnRefresh">تحديث الآن</button>
      </div>
    </div>
    <canvas id="chartTop" height="100"></canvas>
    <div class="table-responsive mt-3">
      <table class="table table-dark table-striped" id="tblTop">
        <thead><tr><th>الرمز</th><th>السعر (USD)</th><th>Market Cap</th><th>24h%</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h5 id="titlePrices">أسعار المنصات</h5>
    <div class="table-responsive">
      <table class="table table-dark table-striped" id="tblPrices">
        <thead><tr><th>رمز</th><th>Binance</th><th>OKX</th><th>Bybit</th><th>Bitget</th><th>BingX</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h5 id="titleArb">فرص الأرّتبراج</h5>
    <div class="table-responsive">
      <table class="table table-dark table-striped" id="tblArb">
        <thead><tr><th>رمز</th><th>شراء من</th><th>بيع في</th><th>Spread</th><th>%</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h5 id="titleWallet">المحفظة التجريبية</h5>
    <table class="table table-dark" id="tblWallet">
      <thead><tr><th>Asset</th><th>Balance</th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="btn btn-success" id="btnTrade">Execute Demo Trade (100 USDT)</button>
  </div>
</div>

<script>
const API_PRICES = '/api/prices';
let MODE = 'DEMO'; // or 'LIVE'
let LANG = 'AR';
let wallet = { USDT: 10000, BTC: 0, ETH: 0 };
let latest = { timestamp:0, symbols:[], data:{} };
const exchanges = ['binance','okx','bybit','bitget','bingx'];

document.getElementById('btnMode').onclick = () => {
  MODE = (MODE==='DEMO' ? 'LIVE' : 'DEMO');
  document.getElementById('btnMode').innerText = MODE;
};
document.getElementById('btnLang').onclick = () => {
  LANG = (LANG === 'AR') ? 'EN' : 'AR';
  document.getElementById('btnLang').innerText = LANG;
  updateText();
};

document.getElementById('btnRefresh').onclick = fetchAndRender;
document.getElementById('btnTrade').onclick = executeDemoTrade;

function updateText(){
  document.getElementById('titleTop').innerText = LANG==='AR' ? 'أعلى 30 عملة' : 'Top 30 coins';
  document.getElementById('titlePrices').innerText = LANG==='AR' ? 'أسعار المنصات' : 'Exchange prices';
  document.getElementById('titleArb').innerText = LANG==='AR' ? 'فرص الأرّتبراج' : 'Arbitrage opportunities';
  document.getElementById('titleWallet').innerText = LANG==='AR' ? 'المحفظة التجريبية' : 'Demo wallet';
}

async function fetchAndRender(){
  try {
    const res = await fetch(API_PRICES);
    const json = await res.json();
    latest = json;
    renderTop(json);
    renderPrices(json);
    findAndRenderArb(json);
    renderWallet();
  } catch (e) {
    console.error('fetch error', e);
  }
}

function renderTop(json){
  const tbody = document.querySelector('#tblTop tbody');
  tbody.innerHTML = '';
  (json.symbols || []).forEach(sym => {
    const marketPrice = json.data[sym] && json.data[sym].binance ? json.data[sym].binance : null;
    tbody.innerHTML += `<tr><td>${sym}</td><td>${marketPrice || '-'}</td><td>-</td><td>-</td></tr>`;
  });
  // chart
  const labels = (json.symbols||[]).slice(0,12);
  const data = labels.map(s => (json.data[s] && json.data[s].binance) ? json.data[s].binance : 0 );
  renderChart(labels,data);
}

function renderChart(labels,data){
  const ctx = document.getElementById('chartTop').getContext('2d');
  if(window._chart) window._chart.destroy();
  window._chart = new Chart(ctx,{ type:'bar', data:{ labels, datasets:[{ label: 'Price USD', data, backgroundColor:'rgba(0,123,255,0.6)' }] }, options:{ responsive:true } });
}

function renderPrices(json){
  const tbody = document.querySelector('#tblPrices tbody');
  tbody.innerHTML = '';
  const symbols = json.symbols || [];
  for(const s of symbols){
    const row = json.data[s] || {};
    tbody.innerHTML += `<tr>
      <td>${s}</td>
      <td>${row.binance ?? '-'}</td>
      <td>${row.okx ?? '-'}</td>
      <td>${row.bybit ?? '-'}</td>
      <td>${row.bitget ?? '-'}</td>
      <td>${row.bingx ?? '-'}</td>
    </tr>`;
  }
}

function findAndRenderArb(json){
  const tbody = document.querySelector('#tblArb tbody');
  tbody.innerHTML = '';
  const symbols = json.symbols || [];
  for(const s of symbols){
    const row = json.data[s];
    if(!row) continue;
    const entries = exchanges.map(e => ({ e, p: row[e] })).filter(x=>x.p);
    if(entries.length < 2) continue;
    entries.sort((a,b)=>a.p-b.p);
    const min = entries[0], max = entries[entries.length-1];
    const spread = (max.p - min.p);
    const pct = spread / min.p * 100;
    if(pct > 0.2) {
      tbody.innerHTML += `<tr>
        <td>${s}</td>
        <td>${min.e}</td>
        <td>${max.e}</td>
        <td>${spread.toFixed(2)}</td>
        <td>${pct.toFixed(2)}</td>
      </tr>`;
    }
  }
}

function renderWallet(){
  const tbody = document.querySelector('#tblWallet tbody');
  tbody.innerHTML = '';
  for(const k in wallet) {
    tbody.innerHTML += `<tr><td>${k}</td><td>${wallet[k].toFixed(6)}</td></tr>`;
  }
}

function executeDemoTrade(){
  const amount = 100;
  if(wallet.USDT >= amount && latest.data && latest.data['BTC'] && latest.data['BTC'].binance){
    wallet.USDT -= amount;
    const price = latest.data['BTC'].binance;
    wallet.BTC += amount / price;
    renderWallet();
    alert(LANG==='AR' ? 'تم تنفيذ صفقة تجريبية' : 'Demo trade executed');
  } else {
    alert(LANG==='AR' ? 'الرصيد غير كافٍ أو بيانات غير متوفرة' : 'Insufficient funds or data');
  }
}

// auto-refresh every 2s
fetchAndRender();
setInterval(fetchAndRender, 2000);
</script>
</body>
</html>
