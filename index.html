<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Crypto Arbitrage Bot</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; }
.navbar { background-color: #0d6efd; }
.section { padding: 15px; margin-top: 15px; background-color: #1e1e1e; border-radius: 10px; }
.table thead { background-color: #333; }
.table tbody tr:hover { background-color: #222; transition: 0.3s; }
button { transition: 0.3s; }
button:hover { transform: scale(1.05); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container-fluid">
  <a class="navbar-brand" href="#">Crypto Bot</a>
  <div class="d-flex">
    <button class="btn btn-light me-2" id="toggleMode">Mode: DEMO</button>
    <button class="btn btn-light" id="toggleLang">العربية</button>
  </div>
</div>
</nav>

<div class="container mt-3">

<!-- Top Coins Section -->
<div class="section">
<h3 id="topCoinsTitle">📊 أعلى 30 عملة</h3>
<canvas id="topCoinsChart" height="100"></canvas>
<table class="table table-dark table-striped mt-3" id="coinsTable">
<thead>
<tr><th>الرمز</th><th>السعر (USD)</th><th>القيمة السوقية</th><th>تغير 24h %</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- Prices Section -->
<div class="section">
<h3 id="pricesTitle">🔍 أسعار المنصات</h3>
<table class="table table-dark table-striped" id="pricesTable">
<thead>
<tr><th>العملة</th><th>Binance</th><th>OKX</th><th>Bybit</th><th>Bitget</th><th>BingX</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- Arbitrage Section -->
<div class="section">
<h3 id="arbTitle">💡 فرص الأرّبتراج</h3>
<table class="table table-dark table-striped" id="arbTable">
<thead>
<tr><th>العملة</th><th>اشترِ من</th><th>بيع في</th><th>Spread (USD)</th><th>نسبة %</th></tr>
</thead>
<tbody></tbody>
</table>
</div>

<!-- Wallet Section -->
<div class="section">
<h3 id="walletTitle">💳 المحفظة التجريبية</h3>
<table class="table table-dark table-striped" id="walletTable">
<thead><tr><th>العملة</th><th>الرصيد</th></tr></thead>
<tbody></tbody>
</table>
<button class="btn btn-success mt-2" onclick="executeTrade()">تنفيذ صفقة تجريبية</button>
</div>

</div>

<script>
// ------------------------------
// 1️⃣ إعداد المتغيرات
// ------------------------------
let MODE = "DEMO"; // DEMO / LIVE
let LANG = "AR";   // AR / EN
let exchanges = ["Binance", "OKX", "Bybit", "Bitget", "BingX"];
let wallet = { USDT: 10000, BTC: 0, ETH: 0 };
let topCoins = [];
let prices = {};
let topCoinsChart;

// ------------------------------
// 2️⃣ تبديل الوضع DEMO / LIVE
// ------------------------------
document.getElementById("toggleMode").onclick = () => {
  MODE = (MODE === "DEMO") ? "LIVE" : "DEMO";
  document.getElementById("toggleMode").innerText = (MODE==="DEMO") ? "Mode: DEMO" : "Mode: LIVE";
};

// ------------------------------
// 3️⃣ تبديل اللغة
// ------------------------------
document.getElementById("toggleLang").onclick = () => {
  LANG = (LANG==="AR") ? "EN" : "AR";
  updateLanguage();
};
function updateLanguage() {
  document.getElementById("topCoinsTitle").innerText = LANG==="AR" ? "📊 أعلى 30 عملة" : "📊 Top 30 Coins";
  document.getElementById("pricesTitle").innerText = LANG==="AR" ? "🔍 أسعار المنصات" : "🔍 Exchange Prices";
  document.getElementById("arbTitle").innerText = LANG==="AR" ? "💡 فرص الأرّبتراج" : "💡 Arbitrage Opportunities";
  document.getElementById("walletTitle").innerText = LANG==="AR" ? "💳 المحفظة التجريبية" : "💳 Demo Wallet";
}

// ------------------------------
// 4️⃣ جلب أعلى 30 عملة من CoinGecko
// ------------------------------
async function fetchTop30() {
  const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=30&page=1");
  const data = await res.json();
  topCoins = data.map(c => ({
    symbol: c.symbol.toUpperCase(),
    price: c.current_price,
    marketCap: c.market_cap,
    change: c.price_change_percentage_24h.toFixed(2)
  }));
  renderCoins();
  renderChart();
}

// ------------------------------
// 5️⃣ تحديث وعرض الجدول
// ------------------------------
function renderCoins() {
  const tbody = document.querySelector("#coinsTable tbody");
  tbody.innerHTML = "";
  topCoins.forEach(c => {
    tbody.innerHTML += `<tr>
      <td>${c.symbol}</td>
      <td>${c.price}</td>
      <td>${c.marketCap}</td>
      <td>${c.change}</td>
    </tr>`;
  });
}

function updatePrices() {
  prices = {};
  topCoins.forEach(c => {
    prices[c.symbol] = {};
    exchanges.forEach(ex => {
      if(MODE==="DEMO") {
        prices[c.symbol][ex] = +(c.price * (0.99 + Math.random()*0.02)).toFixed(2);
      } else {
        prices[c.symbol][ex] = c.price; // LIVE: يمكن تعديل لاستدعاء API لكل منصة
      }
    });
  });
  renderPrices();
  findArb();
  renderWallet();
}

// ------------------------------
// 6️⃣ عرض الأسعار حسب المنصات
// ------------------------------
function renderPrices() {
  const tbody = document.querySelector("#pricesTable tbody");
  tbody.innerHTML = "";
  for(let coin in prices) {
    tbody.innerHTML += `<tr>
      <td>${coin}</td>
      <td>${prices[coin]["Binance"]}</td>
      <td>${prices[coin]["OKX"]}</td>
      <td>${prices[coin]["Bybit"]}</td>
      <td>${prices[coin]["Bitget"]}</td>
      <td>${prices[coin]["BingX"]}</td>
    </tr>`;
  }
}

// ------------------------------
// 7️⃣ فرص الأرّبتراج
// ------------------------------
function findArb() {
  const tbody = document.querySelector("#arbTable tbody");
  tbody.innerHTML = "";
  for(let coin in prices) {
    let data = prices[coin];
    let minEx = exchanges[0], maxEx = exchanges[0];
    let minPrice = data[minEx], maxPrice = data[maxEx];
    for(let ex of exchanges){
      if(data[ex] < minPrice){ minPrice = data[ex]; minEx = ex;}
      if(data[ex] > maxPrice){ maxPrice = data[ex]; maxEx = ex;}
    }
    let spread = (maxPrice - minPrice).toFixed(2);
    let percent = ((spread/minPrice)*100).toFixed(2);
    if(percent > 0.2){
      tbody.innerHTML += `<tr>
        <td>${coin}</td>
        <td>${minEx}</td>
        <td>${maxEx}</td>
        <td>${spread}</td>
        <td>${percent}</td>
      </tr>`;
    }
  }
}

// ------------------------------
// 8️⃣ المحفظة
// ------------------------------
function renderWallet() {
  const tbody = document.querySelector("#walletTable tbody");
  tbody.innerHTML = "";
  for(let coin in wallet){
    tbody.innerHTML += `<tr><td>${coin}</td><td>${wallet[coin].toFixed(4)}</td></tr>`;
  }
}

// ------------------------------
// 9️⃣ تنفيذ صفقة تجريبية
// ------------------------------
function executeTrade(){
  let amount = 100; // USDT
  if(wallet.USDT >= amount){
    wallet.USDT -= amount;
    wallet.BTC += amount / prices["BTC"]["Binance"];
    renderWallet();
    alert(LANG==="AR"?"تم تنفيذ صفقة تجريبية: شراء BTC بمقدار 100 USDT":"Demo Trade executed: Bought BTC 100 USDT");
  } else {
    alert(LANG==="AR"?"رصيد USDT غير كافٍ!":"Not enough USDT!");
  }
}

// ------------------------------
// 10️⃣ رسم بياني Top Coins
// ------------------------------
function renderChart(){
  const ctx = document.getElementById("topCoinsChart").getContext("2d");
  if(topCoinsChart) topCoinsChart.destroy();
  topCoinsChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: topCoins.map(c=>c.symbol),
      datasets:[{
        label: LANG==="AR"?"السعر (USD)":"Price (USD)",
        data: topCoins.map(c=>c.price),
        backgroundColor:'rgba(10,132,255,0.7)',
        borderColor:'rgba(10,132,255,1)',
        borderWidth:1
      }]
    },
    options:{ responsive:true, plugins:{ legend:{ display:true } } }
  });
}

// ------------------------------
// 11️⃣ التحديث الدوري
// ------------------------------
fetchTop30().then(()=>{
  setInterval(updatePrices, 2000); // تحديث كل ثانيتين
  setInterval(renderChart, 5000);   // تحديث الرسم كل 5 ثواني
});
</script>

</body>
</html>
